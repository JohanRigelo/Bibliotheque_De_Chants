name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run build

      - name: Notifier Discord si échec
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"🔴 Échec sur **${{ github.repository }}**\\nCommit : ${{ github.sha }}\\nVoir : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
